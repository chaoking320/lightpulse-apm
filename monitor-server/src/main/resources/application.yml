server:
  port: 8086
spring:
  application:
    name: monitor-server
  datasource:
    url: jdbc:h2:file:./data/monitor_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    # HikariCP 连接池优化配置
    hikari:
      # 连接池大小
      minimum-idle: 10                # 最小空闲连接数
      maximum-pool-size: 50           # 最大连接数 (根据CPU核心数调整: 核心数 x 2 + 有效磁盘数)
      # 连接超时配置
      connection-timeout: 20000       # 获取连接超时时间 20秒
      idle-timeout: 300000            # 空闲连接存活时间 5分钟
      max-lifetime: 1200000           # 连接最大存活时间 20分钟
      # 性能优化
      auto-commit: true               # 自动提交
      connection-test-query: SELECT 1 # 连接测试查询 (H2 不需要，但保留用于 MySQL)
      # 连接池命名
      pool-name: LightPulseHikariCP
      # 泄漏检测
      leak-detection-threshold: 60000 # 连接泄漏检测阈值 60秒
      # PreparedStatement 缓存
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        useLocalSessionState: true
        rewriteBatchedStatements: true
        cacheResultSetMetadata: true
        cacheServerConfiguration: true
        elideSetAutoCommits: true
        maintainTimeStats: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
logging:
  level:
    root: INFO
    com.monitor: INFO
    com.baomidou.mybatisplus: INFO
    org.mybatis: WARN
  file:
    name: logs/server.log
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 7
      total-size-cap: 300MB

# LightPulse 监控系统配置
monitor:
  victoriametrics:
    enabled: false
    url: http://127.0.0.1:8428
  alert:
    # 企微 / 钉钉 / 飞书 机器人 Webhook 地址（留空则只记录告警到日志与数据库）
    webhook: ""
