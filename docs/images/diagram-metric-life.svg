<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <rect width="1000" height="330" fill="#FBFAF6"/>

  <text x="60" y="44" font-size="15" letter-spacing="3" fill="#9A9484">一条指标的一生</text>

  <!-- 时间轴 -->
  <line x1="70" y1="152" x2="930" y2="152" stroke="#C9C2B2" stroke-width="1.5"/>
  <polygon points="934,152 922,146 922,158" fill="#C9C2B2"/>

  <!-- 静默窗口括号 -->
  <path d="M448 130 L448 100 L700 100 L700 130" fill="none" stroke="#A8442A" stroke-width="1.2"/>
  <text x="574" y="90" font-size="11" fill="#A8442A" text-anchor="middle">静默窗口 · 默认 30 分钟 · 同 key 只通知一次</text>

  <!-- 保留期括号 -->
  <path d="M690 204 L690 216 L890 216 L890 204" fill="none" stroke="#3C5560" stroke-width="1.2"/>
  <text x="790" y="234" font-size="11" fill="#3C5560" text-anchor="middle">索引存活 30 天</text>

  <!-- 节点 -->
  <g>
    <circle cx="95" cy="152" r="5.5" fill="#A8442A"/>
    <circle cx="215" cy="152" r="5.5" fill="#A8442A"/>
    <circle cx="335" cy="152" r="5.5" fill="#3C5560"/>
    <circle cx="455" cy="152" r="5.5" fill="#3C5560"/>
    <circle cx="570" cy="152" r="5.5" fill="#3C5560"/>
    <circle cx="690" cy="152" r="5.5" fill="#A8442A"/>
    <circle cx="870" cy="152" r="5.5" fill="#9A9484"/>
  </g>

  <!-- 标签 -->
  <text x="95" y="176" font-size="12" fill="#5C574B" text-anchor="middle">采集</text>
  <text x="95" y="194" font-size="10.5" fill="#8A8578" text-anchor="middle">每 60 秒</text>

  <text x="215" y="176" font-size="12" fill="#5C574B" text-anchor="middle">上报</text>
  <text x="215" y="194" font-size="10.5" fill="#8A8578" text-anchor="middle">纯出站 POST</text>

  <text x="335" y="176" font-size="12" fill="#5C574B" text-anchor="middle">落索引</text>
  <text x="335" y="194" font-size="10.5" fill="#8A8578" text-anchor="middle">metrics-当天日期</text>

  <text x="455" y="176" font-size="12" fill="#5C574B" text-anchor="middle">判阈值</text>
  <text x="455" y="194" font-size="10.5" fill="#8A8578" text-anchor="middle">每 60 秒扫一遍</text>

  <text x="570" y="176" font-size="12" fill="#5C574B" text-anchor="middle">过静默</text>
  <text x="570" y="194" font-size="10.5" fill="#8A8578" text-anchor="middle">同目标不重复</text>

  <text x="690" y="176" font-size="12" fill="#5C574B" text-anchor="middle">通知</text>
  <text x="690" y="194" font-size="10.5" fill="#8A8578" text-anchor="middle">群机器人加签</text>

  <text x="870" y="176" font-size="12" fill="#5C574B" text-anchor="middle">丢弃</text>
  <text x="870" y="194" font-size="10.5" fill="#8A8578" text-anchor="middle">03:30 整索引删</text>

  <!-- 刻度 -->
  <g stroke="#E6E0D2">
    <line x1="95" y1="134" x2="95" y2="142"/>
    <line x1="215" y1="134" x2="215" y2="142"/>
    <line x1="335" y1="134" x2="335" y2="142"/>
    <line x1="455" y1="134" x2="455" y2="142"/>
    <line x1="570" y1="134" x2="570" y2="142"/>
    <line x1="690" y1="134" x2="690" y2="142"/>
    <line x1="870" y1="134" x2="870" y2="142"/>
  </g>

  <line x1="60" y1="266" x2="940" y2="266" stroke="#E6E0D2"/>
  <text x="60" y="290" font-size="11" fill="#B4AE9C">整条生命周期里，唯一“会思考”的一步只有「判阈值 + 过静默」，其余都是搬运，和搬运之后的清理。</text>
  <text x="60" y="312" font-size="11" fill="#B4AE9C">把复杂度压在两个点上，是为了让这套东西在三台机器、零专职运维的条件下也能长期活下去。</text>
</svg>
