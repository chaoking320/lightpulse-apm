<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitor APM</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.11.10/dayjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/antd/5.12.8/reset.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background: #f5f5f5; color: #333; }
.header { background: #1a1a2e; color: #fff; padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
.header h1 { font-size: 18px; font-weight: 600; }
.header .sub { font-size: 12px; opacity: .7; }
.container { max-width: 1400px; margin: 0 auto; padding: 16px; }
.kpi-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 16px; }
.kpi-card { background: #fff; border-radius: 8px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.kpi-card .label { font-size: 12px; color: #888; }
.kpi-card .value { font-size: 28px; font-weight: 700; margin-top: 4px; }
.kpi-card .value.green { color: #52c41a; }
.kpi-card .value.red { color: #ff4d4f; }
.kpi-card .value.blue { color: #1890ff; }
.chart-box { background: #fff; border-radius: 8px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.chart-box h3 { font-size: 14px; margin-bottom: 12px; }
.chart { height: 250px; }
.table-wrap { background: #fff; border-radius: 8px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #f0f0f0; white-space: nowrap; }
th { font-weight: 600; color: #666; font-size: 12px; }
tr:hover td { background: #fafafa; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
.badge.green { background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; }
.badge.red { background: #fff2f0; color: #ff4d4f; border: 1px solid #ffccc7; }
.badge.blue { background: #e6f7ff; color: #1890ff; border: 1px solid #91d5ff; }
.badge.orange { background: #fff7e6; color: #fa8c16; border: 1px solid #ffd591; }
.badge.gray { background: #fafafa; color: #999; border: 1px solid #d9d9d9; }
.tab-bar { display: flex; gap: 0; margin-bottom: 16px; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.tab { padding: 12px 24px; cursor: pointer; font-size: 14px; border: none; background: transparent; }
.tab.active { background: #1a1a2e; color: #fff; font-weight: 500; }
.tab:hover:not(.active) { background: #f5f5f5; }
.btn { display: inline-flex; align-items: center; gap: 4px; padding: 6px 14px; border-radius: 4px; border: 1px solid #d9d9d9; font-size: 13px; cursor: pointer; background: #fff; }
.btn:hover { border-color: #1890ff; color: #1890ff; }
.btn.primary { background: #1890ff; color: #fff; border-color: #1890ff; }
.btn.primary:hover { background: #40a9ff; }
.btn.danger { color: #ff4d4f; border-color: #ff4d4f; }
.btn.danger:hover { background: #ff4d4f; color: #fff; }
.btn.small { padding: 3px 10px; font-size: 12px; }
.btn-group { display: flex; gap: 6px; flex-wrap: wrap; }
.form-row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
.form-row label { font-size: 13px; color: #666; min-width: 80px; }
.form-row input, .form-row select, .form-row textarea { padding: 6px 10px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 13px; }
.form-row input, .form-row select { height: 34px; }
.form-row textarea { min-height: 60px; resize: vertical; }
.form-row .field { display: flex; align-items: center; gap: 6px; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 1000; display: flex; align-items: center; justify-content: center; }
.modal { background: #fff; border-radius: 8px; width: 640px; max-height: 80vh; overflow-y: auto; padding: 24px; box-shadow: 0 4px 12px rgba(0,0,0,.15); }
.modal h3 { font-size: 16px; margin-bottom: 16px; }
.modal .form-row input[type="text"], .modal .form-row input[type="number"], .modal .form-row select { width: 240px; }
.modal .btn-row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; padding-top: 12px; border-top: 1px solid #f0f0f0; }
.toolbar { display: flex; gap: 12px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; }
.alert-icon { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.alert-icon.new { background: #ff4d4f; }
.alert-icon.ack { background: #52c41a; }
.empty { padding: 40px; text-align: center; color: #999; }
.engine-card-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
.engine-card { border: 2px solid #e8e8e8; border-radius: 8px; padding: 14px; cursor: pointer; transition: all .2s; background: #fafafa; }
.engine-card:hover { border-color: #91d5ff; background: #fff; }
.engine-card.active { border-color: #1890ff; background: #e6f7ff; box-shadow: 0 2px 8px rgba(24,144,255,.15); }
.engine-card .title { font-weight: 600; font-size: 14px; margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between; }
.engine-card .desc { font-size: 12px; color: #666; line-height: 1.5; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const { useState, useEffect, useRef, useCallback } = React;
const BASE = (function() {
  const p = window.location.pathname;
  const i = p.indexOf('/apm');
  if (i !== -1) {
    return p.substring(0, i + 4);
  }
  const lastSlash = p.lastIndexOf('/');
  return lastSlash > 0 ? p.substring(0, lastSlash) : '';
})();

// 优先接收 URL 中的 token 参数并同步写入 localStorage 与 Cookie，消除重定向死循环
try {
  const urlParams = new URLSearchParams(window.location.search);
  const tokenParam = urlParams.get('token');
  if (tokenParam) {
    localStorage.setItem('LP_TOKEN', tokenParam);
    document.cookie = `LP_TOKEN=${tokenParam}; path=/; max-age=604800; SameSite=Lax`;
  }
} catch(e) {}

const TIME_OPTIONS = [
  {label:'15分钟',value:15},
  {label:'30分钟',value:30},
  {label:'1小时',value:60},
  {label:'3小时',value:180},
  {label:'6小时',value:360},
  {label:'24小时',value:1440},
];

const RULE_TYPES = [
  {value:'method_latency',label:'方法耗时'},
  {value:'error_rate',label:'错误率'},
  {value:'error_count',label:'错误数'},
  {value:'calls_per_minute',label:'调用次数'},
];

const METRIC_FIELDS = [
  {value:'avg_cost_ms',label:'平均耗时(ms)'},
  {value:'max_cost_ms',label:'最大耗时(ms)'},
  {value:'error_rate',label:'错误率(%)'},
  {value:'error_count',label:'错误数'},
  {value:'total_calls',label:'总调用数'},
];

const MATCH_TYPES = [
  {value:'annotation', label:'注解匹配'},
  {value:'class_name', label:'类名匹配'},
  {value:'package_name',label:'包名匹配'},
];

const MATCH_TYPE_LABEL = {annotation:'注解', class_name:'类名', package_name:'包名'};

const api = (path, opts) => {
  const token = localStorage.getItem('LP_TOKEN') || '';
  const currentRole = (localStorage.getItem('LP_ROLE') || 'ADMIN').toUpperCase();
  const method = (opts && opts.method ? opts.method.toUpperCase() : 'GET');
  if (currentRole === 'VIEWER' && (method === 'POST' || method === 'PUT' || method === 'DELETE' || method === 'PATCH')) {
    if (!path.includes('/auth/logout')) {
      alert('🔒 操作拒绝：当前处于只读访客模式 (VIEWER)，系统所有新增、修改、重置与删除功能均已被安全锁定！');
      return Promise.reject(new Error('只读模式锁定'));
    }
  }
  const customHeaders = (opts && opts.headers) || {};
  const defaultHeaders = {
    'Authorization': token ? ('Bearer ' + token) : '',
    'X-Token': token
  };
  if (opts && opts.body && typeof opts.body === 'string') {
    defaultHeaders['Content-Type'] = 'application/json';
  }
  const headers = Object.assign(defaultHeaders, customHeaders);

  return fetch(BASE + path, Object.assign({}, opts || {}, { headers }))
    .then(r => {
      if (r.status === 401) {
        localStorage.removeItem('LP_TOKEN');
        localStorage.removeItem('LP_USER');
        localStorage.removeItem('LP_ROLE');
        document.cookie = 'LP_TOKEN=; path=/; max-age=0';
        window.location.replace(BASE + '/login.html');
        return Promise.reject(new Error('未登录或登录已过期'));
      }
      if (r.status === 403) {
        return r.json().then(data => {
          alert(data.message || '操作被拒绝：当前为只读账号 (viewer)，无权执行修改或删除操作！');
          return Promise.reject(new Error(data.message || '403 Forbidden'));
        }).catch(err => {
          if (err.message && err.message !== '403 Forbidden') alert(err.message);
          return Promise.reject(err);
        });
      }
      return r.json();
    });
};

function KPICards({ data }) {
  const total = (data?.totalCalls || 0);
  const errors = (data?.totalErrors || 0);
  const errorRate = total > 0 ? ((errors/total)*100).toFixed(2) : '0.00';
  return (
    React.createElement('div', {className:'kpi-row'},
      React.createElement('div',{className:'kpi-card'},
        React.createElement('div',{className:'label'},'总调用次数'),
        React.createElement('div',{className:'value blue'},total.toLocaleString())),
      React.createElement('div',{className:'kpi-card'},
        React.createElement('div',{className:'label'},'错误数'),
        React.createElement('div',{className:'value '+(errors>0?'red':'green')},errors.toLocaleString())),
      React.createElement('div',{className:'kpi-card'},
        React.createElement('div',{className:'label'},'错误率'),
        React.createElement('div',{className:'value '+(errorRate>1?'red':'green')},errorRate+'%')),
      React.createElement('div',{className:'kpi-card'},
        React.createElement('div',{className:'label'},'接口数'),
        React.createElement('div',{className:'value blue'},(data?.endpoints?.length||0))))
  );
}

function TrendChart({ data }) {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current || !data?.length) return;
    const chart = echarts.init(ref.current);
    chart.setOption({
      tooltip: { trigger: 'axis' },
      grid: { left: '3%', right: '4%', bottom: '3%', top: '5%', containLabel: true },
      xAxis: { type: 'category', data: data.map(d=>d.t||''), axisLabel: { fontSize: 11 } },
      yAxis: [
        { type: 'value', name: 'TPS', nameTextStyle: { fontSize: 11 } },
        { type: 'value', name: 'avg ms', nameTextStyle: { fontSize: 11 } }
      ],
      series: [
        { name: 'TPS', type: 'bar', data: data.map(d=>d.calls||0), itemStyle: { color: '#1890ff' } },
        { name: 'Avg Cost', type: 'line', yAxisIndex: 1, data: data.map(d=>Math.round(d.avg_cost||0)),
          lineStyle: { color: '#ff4d4f' }, itemStyle: { color: '#ff4d4f' } }
      ]
    });
    return () => chart.dispose();
  }, [data]);
  return React.createElement('div', {ref, className:'chart'});
}

function EndpointTable({ endpoints, onSelect }) {
  if (!endpoints?.length) return React.createElement('div',{className:'empty'},'暂无数据');
  const rows = endpoints.map((e,i) =>
    React.createElement('tr',{key:i, onClick:()=>onSelect?.(e), style:{cursor:'pointer'}},
      React.createElement('td',{},React.createElement('span',{className:'badge blue'},e.http_method||'ALL')),
      React.createElement('td',{},e.class_name),
      React.createElement('td',{},e.method_name),
      React.createElement('td',{},e.calls?.toLocaleString()),
      React.createElement('td',{},React.createElement('span',{className:e.errors>0?'badge red':'badge green'},e.errors||0)),
      React.createElement('td',{},Math.round(e.avg_cost||0)+'ms'),
      React.createElement('td',{},(e.max_cost||0)+'ms'))
  );
  return React.createElement('div',{className:'table-wrap'},
    React.createElement('table',{},
      React.createElement('thead',{},
        React.createElement('tr',{},
          ['方法','类','方法','调用','错误','平均','最大'].map(h=>React.createElement('th',{key:h},h)))),
      React.createElement('tbody',{},...rows)));
}

// ====== 规则管理 ======

function RuleEditModal({ rule, onSave, onClose }) {
  const [form, setForm] = useState({
    ruleName: '', appName: '*', ruleType: 'method_latency',
    targetClass: '%', targetMethod: '%', metricField: 'max_cost_ms',
    operator: '>', threshold: 3000, evalWindowMin: 5,
    minSample: 1, enabled: true, description: '',
    ...(rule||{})
  });

  const set = (k, v) => setForm(f=>({...f,[k]:v}));

  const handleSave = () => {
    const body = {...form};
    // 清理特殊值
    if (form.targetClass === '') body.targetClass = '%';
    if (form.targetMethod === '') body.targetMethod = '%';
    const url = rule?.id ? `/api/v1/rules/${rule.id}` : '/api/v1/rules';
    const method = rule?.id ? 'PUT' : 'POST';
    api(url, {method, headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)}).then(r => {
      if (r.code === 200 || r.id) onSave();
    });
  };

  return React.createElement('div',{className:'modal-overlay', onClick:e=>e.target===e.currentTarget&&onClose()},
    React.createElement('div',{className:'modal'},
      React.createElement('h3',{}, rule?.id ? '编辑规则' : '新建规则'),
      React.createElement('div',{className:'form-row'},
        React.createElement('label',{},'规则名称'),
        React.createElement('input',{type:'text', value:form.ruleName, onChange:e=>set('ruleName',e.target.value),
          placeholder:'例如: 下单接口超时预警'})),
      React.createElement('div',{className:'form-row'},
        React.createElement('label',{},'应用'),
        React.createElement('input',{type:'text', value:form.appName, onChange:e=>set('appName',e.target.value),
          style:{width:120}, placeholder:'*=全局'})),
      React.createElement('div',{className:'form-row'},
        React.createElement('label',{},'规则类型'),
        React.createElement('select',{value:form.ruleType, onChange:e=>set('ruleType',e.target.value)},
          RULE_TYPES.map(t=>React.createElement('option',{key:t.value,value:t.value},t.label)))),
      React.createElement('div',{className:'form-row'},
        React.createElement('label',{},'目标类'),
        React.createElement('input',{type:'text', value:form.targetClass, onChange:e=>set('targetClass',e.target.value),
          placeholder:'支持 % 模糊匹配'})),
      React.createElement('div',{className:'form-row'},
        React.createElement('label',{},'目标方法'),
        React.createElement('input',{type:'text', value:form.targetMethod, onChange:e=>set('targetMethod',e.target.value),
          placeholder:'支持 % 模糊匹配'})),
      React.createElement('div',{className:'form-row'},
        React.createElement('label',{},'监控指标'),
        React.createElement('select',{value:form.metricField, onChange:e=>set('metricField',e.target.value)},
          METRIC_FIELDS.map(m=>React.createElement('option',{key:m.value,value:m.value},m.label)))),
      React.createElement('div',{className:'form-row'},
        React.createElement('span',{className:'field'},
          React.createElement('label',{style:{minWidth:'auto'}},'阈值'),
          React.createElement('select',{value:form.operator, onChange:e=>set('operator',e.target.value),
            style:{width:60}},
            ['>','>=','<','<='].map(o=>React.createElement('option',{key:o,value:o},o))),
          React.createElement('input',{type:'number', value:form.threshold,
            onChange:e=>set('threshold',Number(e.target.value)), style:{width:120}}))),
      React.createElement('div',{className:'form-row'},
        React.createElement('label',{},'评估窗口'),
        React.createElement('input',{type:'number', value:form.evalWindowMin,
          onChange:e=>set('evalWindowMin',Number(e.target.value)), style:{width:80}}),
        React.createElement('span',{style:{fontSize:12,color:'#999'}},'分钟')),
      React.createElement('div',{className:'form-row'},
        React.createElement('label',{},'最小采样数'),
        React.createElement('input',{type:'number', value:form.minSample,
          onChange:e=>set('minSample',Number(e.target.value)), style:{width:80}})),
      React.createElement('div',{className:'form-row'},
        React.createElement('label',{},'规则描述'),
        React.createElement('textarea',{value:form.description||'',
          onChange:e=>set('description',e.target.value), style:{width:360}})),
      React.createElement('div',{className:'btn-row'},
        React.createElement('button',{className:'btn', onClick:onClose},'取消'),
        React.createElement('button',{className:'btn primary', onClick:handleSave}, rule?.id?'保存':'创建'))));
}

function RulesTab() {
  const [rules, setRules] = useState([]);
  const [editingRule, setEditingRule] = useState(null);

  const load = () => api('/api/v1/rules').then(setRules);
  useEffect(() => { load(); }, []);

  const toggle = (rule) => {
    api(`/api/v1/rules/${rule.id}/toggle`, {method:'PUT'}).then(load);
  };

  const del = (rule) => {
    if (!confirm(`确定删除规则「${rule.ruleName}」？`)) return;
    api(`/api/v1/rules/${rule.id}`, {method:'DELETE'}).then(load);
  };

  const rows = (rules||[]).map(r =>
    React.createElement('tr',{key:r.id},
      React.createElement('td',{},r.ruleName),
      React.createElement('td',{},React.createElement('span',{className:'badge blue'},r.appName)),
      React.createElement('td',{},RULE_TYPES.find(t=>t.value===r.ruleType)?.label||r.ruleType),
      React.createElement('td',{},r.targetClass||'%'),
      React.createElement('td',{},r.targetMethod||'%'),
      React.createElement('td',{},
        METRIC_FIELDS.find(m=>m.value===r.metricField)?.label||r.metricField),
      React.createElement('td',{},r.operator+' '+r.threshold),
      React.createElement('td',{},r.evalWindowMin+'分钟'),
      React.createElement('td',{},
        React.createElement('span',{className:'badge '+(r.enabled?'green':'gray')},
          r.enabled?'已启用':'已禁用')),
      React.createElement('td',{},
        React.createElement('div',{className:'btn-group'},
          React.createElement('button',{className:'btn small', onClick:()=>setEditingRule(r)},'编辑'),
          React.createElement('button',{className:'btn small '+(r.enabled?'':'primary'),
            onClick:()=>toggle(r)}, r.enabled?'禁用':'启用'),
          React.createElement('button',{className:'btn small danger', onClick:()=>del(r)},'删除'))))
  );

  return React.createElement('div',{},
    React.createElement('div',{className:'toolbar'},
      React.createElement('button',{className:'btn primary', onClick:()=>setEditingRule({})},'+ 新建规则')),
    React.createElement('div',{className:'table-wrap'},
      rows.length===0
        ? React.createElement('div',{className:'empty'},'暂无自定义规则，点击上方按钮创建')
        : React.createElement('table',{},
            React.createElement('thead',{},
              React.createElement('tr',{},
                ['规则名称','应用','类型','目标类','目标方法','指标','阈值','窗口','状态','操作'].map(h=>
                  React.createElement('th',{key:h},h)))),
            React.createElement('tbody',{},...rows))),
    editingRule && React.createElement(RuleEditModal,{
      rule: editingRule?.id ? editingRule : null,
      onSave: () => { setEditingRule(null); load(); },
      onClose: () => setEditingRule(null)
    }));
}

// ====== 采集策略 ======

function CaptureConfigModal({ config, onSave, onClose }) {
  const [form, setForm] = useState({
    configName: '', appName: '*', matchType: 'annotation',
    classMatch: 'org.springframework.web.bind.annotation.RestController',
    methodMatch: '%', enabled: true, description: '',
    ...(config||{})
  });

  const set = (k, v) => setForm(f=>({...f,[k]:v}));

  const handleSave = () => {
    const body = {...form};
    const url = config?.id ? `/api/v1/capture-configs/${config.id}` : '/api/v1/capture-configs';
    const method = config?.id ? 'PUT' : 'POST';
    api(url, {method, headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)}).then(r => {
      if (r.code === 200 || r.id) onSave();
    });
  };

  return React.createElement('div',{className:'modal-overlay', onClick:e=>e.target===e.currentTarget&&onClose()},
    React.createElement('div',{className:'modal'},
      React.createElement('h3',{}, config?.id ? '编辑采集策略' : '新建采集策略'),
      React.createElement('div',{className:'form-row'},
        React.createElement('label',{},'策略名称'),
        React.createElement('input',{type:'text', value:form.configName, onChange:e=>set('configName',e.target.value),
          placeholder:'例如: 拦截所有 Controller'})),
      React.createElement('div',{className:'form-row'},
        React.createElement('label',{},'应用'),
        React.createElement('input',{type:'text', value:form.appName, onChange:e=>set('appName',e.target.value),
          style:{width:120}, placeholder:'*=全局'})),
      React.createElement('div',{className:'form-row'},
        React.createElement('label',{},'匹配类型'),
        React.createElement('select',{value:form.matchType, onChange:e=>set('matchType',e.target.value)},
          MATCH_TYPES.map(t=>React.createElement('option',{key:t.value,value:t.value},t.label)))),
      React.createElement('div',{className:'form-row'},
        React.createElement('label',{},'类匹配'),
        React.createElement('input',{type:'text', value:form.classMatch, onChange:e=>set('classMatch',e.target.value),
          style:{width:360}, placeholder:form.matchType==='annotation'?'注解全名':'支持 % 通配符'})),
      React.createElement('div',{className:'form-row'},
        React.createElement('label',{},'方法匹配'),
        React.createElement('input',{type:'text', value:form.methodMatch, onChange:e=>set('methodMatch',e.target.value),
          style:{width:360}, placeholder:'%=全部方法, 或注解全名/方法名(支持%)'})),
      React.createElement('div',{className:'form-row'},

// ====== 日志中心 (Log Explorer & Rules) ======
function LogsTab({ isViewer }) {
  const [subTab, setSubTab] = useState('explore'); // 'explore' | 'configs'

  // 元数据选项 (应用名、主机名、文件路径)
  const [meta, setMeta] = useState({ appNames: [], hostNames: [], logPaths: [] });

  // 检索筛选条件
  const [appName, setAppName] = useState('');
  const [hostName, setHostName] = useState('');
  const [logPath, setLogPath] = useState('');
  const [logLevel, setLogLevel] = useState('ALL');
  const [keyword, setKeyword] = useState('');
  const [traceId, setTraceId] = useState('');
  const [timeRange, setTimeRange] = useState('1h');
  const [customStart, setCustomStart] = useState('');
  const [customEnd, setCustomEnd] = useState('');
  const [showCustomTime, setShowCustomTime] = useState(false);
  const [page, setPage] = useState(1);
  const pageSize = 50;

  // 查询结果与状态
  const [loading, setLoading] = useState(false);
  const [logsData, setLogsData] = useState({ total: 0, data: [] });
  const [liveTail, setLiveTail] = useState(false);
  const [expandedRows, setExpandedRows] = useState({});

  // 上下文查看弹窗
  const [contextModal, setContextModal] = useState({ visible: false, target: null, list: [], loading: false });

  // 采集规则管理
  const [configs, setConfigs] = useState([]);
  const [showConfigModal, setShowConfigModal] = useState(false);
  const emptyConfig = {
    ruleName: '', appName: '*', hostName: '*', logPath: '/data/logs/app.log',
    collectMode: 'WARN_ERROR', keywordFilter: '', excludeKeyword: '',
    contextLines: 10, maxRatePerSec: 200, alertEnabled: 0, alertThreshold: 5, enabled: 1
  };
  const [configForm, setConfigForm] = useState(emptyConfig);
  const [editingConfigId, setEditingConfigId] = useState(null);

  // 加载元数据选项
  useEffect(() => {
    api('/api/v1/logs/metadata').then(r => {
      if (r && r.code === 200) {
        setMeta({
          appNames: r.appNames || [],
          hostNames: r.hostNames || [],
          logPaths: r.logPaths || []
        });
      }
    }).catch(ignored => {});
  }, []);

  // 执行日志检索
  const doSearch = useCallback((p = 1) => {
    setLoading(true);
    let start = 'now-1h';
    let end = 'now';
    let interval = '1m';

    if (timeRange === '15m') { start = 'now-15m'; interval = '30s'; }
    else if (timeRange === '1h') { start = 'now-1h'; interval = '1m'; }
    else if (timeRange === '6h') { start = 'now-6h'; interval = '5m'; }
    else if (timeRange === '24h') { start = 'now-24h'; interval = '20m'; }
    else if (timeRange === '3d') { start = 'now-3d'; interval = '1h'; }
    else if (timeRange === '7d') { start = 'now-7d'; interval = '3h'; }
    else if (timeRange === 'custom') {
      if (customStart) start = customStart;
      if (customEnd) end = customEnd;
      let diffHours = 24;
      if (customStart && customEnd) {
        diffHours = Math.max(0.5, (new Date(customEnd) - new Date(customStart)) / 3600000);
      }
      if (diffHours <= 0.5) interval = '30s';
      else if (diffHours <= 2) interval = '1m';
      else if (diffHours <= 6) interval = '5m';
      else if (diffHours <= 24) interval = '20m';
      else if (diffHours <= 72) interval = '1h';
      else if (diffHours <= 168) interval = '3h';
      else interval = '1d';
    }

    let url = `/api/v1/logs/search?page=${p}&size=${pageSize}&startTime=${encodeURIComponent(start)}&endTime=${encodeURIComponent(end)}`;
    if (appName) url += `&appName=${encodeURIComponent(appName)}`;
    if (hostName) url += `&hostName=${encodeURIComponent(hostName)}`;
    if (logPath) url += `&logPath=${encodeURIComponent(logPath)}`;
    if (logLevel && logLevel !== 'ALL') url += `&logLevel=${encodeURIComponent(logLevel)}`;
    if (keyword) url += `&keyword=${encodeURIComponent(keyword)}`;
    if (traceId) url += `&traceId=${encodeURIComponent(traceId)}`;

    api(url).then(r => {
      if (r && r.code === 200) {
        setLogsData(r);
        setPage(p);
      }
    }).finally(() => setLoading(false));

    // 同时拉取柱状图
    let histUrl = `/api/v1/logs/histogram?startTime=${encodeURIComponent(start)}&endTime=${encodeURIComponent(end)}&interval=${interval}`;
    if (appName) histUrl += `&appName=${encodeURIComponent(appName)}`;
    if (hostName) histUrl += `&hostName=${encodeURIComponent(hostName)}`;
    if (logPath) histUrl += `&logPath=${encodeURIComponent(logPath)}`;
    if (keyword) histUrl += `&keyword=${encodeURIComponent(keyword)}`;

    api(histUrl).then(r => {
      if (r && r.code === 200 && r.buckets) {
        renderHistogramChart(r.buckets);
      }
    }).catch(ignored => {});
  }, [appName, hostName, logPath, logLevel, keyword, traceId, timeRange, customStart, customEnd]);

  useEffect(() => {
    if (subTab === 'explore') {
      doSearch(1);
    }
  }, [subTab, doSearch]);

  // 实时 Tail 轮询 (每 3 秒刷新第一页)
  useEffect(() => {
    if (!liveTail || subTab !== 'explore') return;
    const timer = setInterval(() => {
      doSearch(1);
    }, 3000);
    return () => clearInterval(timer);
  }, [liveTail, subTab, doSearch]);

  // ECharts 柱状图渲染
  const renderHistogramChart = (buckets) => {
    const el = document.getElementById('log-histogram-chart');
    if (!el || !window.echarts) return;
    let chart = echarts.getInstanceByDom(el);
    if (!chart) chart = echarts.init(el);

    const times = buckets.map(b => {
      if (!b.time) return '';
      if (timeRange === '3d' || timeRange === '7d' || (timeRange === 'custom' && b.time.length >= 16)) {
        return b.time.substring(5, 16).replace('T', ' ');
      }
      return b.time.length >= 19 ? b.time.substring(11, 19) : b.time;
    });
    const infos = buckets.map(b => b.info || 0);
    const warns = buckets.map(b => b.warn || 0);
    const errors = buckets.map(b => b.error || 0);

    chart.setOption({
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
      legend: { data: ['INFO', 'WARN', 'ERROR'], textStyle: { fontSize: 11 } },
      grid: { left: '3%', right: '3%', bottom: '8%', top: '25%', containLabel: true },
      xAxis: { type: 'category', data: times, axisLabel: { fontSize: 10 } },
      yAxis: { type: 'value', minInterval: 1, splitLine: { lineStyle: { type: 'dashed' } } },
      series: [
        { name: 'INFO', type: 'bar', stack: 'total', data: infos, itemStyle: { color: '#10b981' } },
        { name: 'WARN', type: 'bar', stack: 'total', data: warns, itemStyle: { color: '#f59e0b' } },
        { name: 'ERROR', type: 'bar', stack: 'total', data: errors, itemStyle: { color: '#ef4444' } }
      ]
    });
  };

  // 查看上下文 (Show Context)
  const openContext = (record) => {
    setContextModal({ visible: true, target: record, list: [], loading: true });
    // 优先从嵌入式上下文快照恢复
    if (record.contextJson) {
      try {
        const rawLines = JSON.parse(record.contextJson);
        if (Array.isArray(rawLines) && rawLines.length > 0) {
          const list = rawLines.map((line, idx) => ({
            lineNumber: (record.lineNumber || 0) - rawLines.length + idx,
            content: line,
            isTarget: false
          }));
          list.push({
            lineNumber: record.lineNumber,
            content: record.content,
            isTarget: true
          });
          setContextModal({ visible: true, target: record, list, loading: false });
          return;
        }
      } catch (ignored) {}
    }

    const url = `/api/v1/logs/context?appName=${encodeURIComponent(record.appName)}&hostName=${encodeURIComponent(record.hostName)}&logPath=${encodeURIComponent(record.logPath)}&lineNumber=${record.lineNumber || 0}&range=15`;
    api(url).then(r => {
      const records = (r && r.data) ? r.data : [];
      setContextModal({
        visible: true,
        target: record,
        list: records.map(rec => ({
          ...rec,
          isTarget: rec.lineNumber === record.lineNumber || rec.content === record.content
        })),
        loading: false
      });
    }).catch(e => {
      setContextModal({ visible: true, target: record, list: [{ lineNumber: record.lineNumber, content: record.content, isTarget: true }], loading: false });
    });
  };

  // 采集规则列表加载
  const loadConfigs = useCallback(() => {
    api('/api/v1/log-configs').then(r => {
      if (r && r.data) setConfigs(r.data);
    });
  }, []);

  useEffect(() => {
    if (subTab === 'configs') loadConfigs();
  }, [subTab, loadConfigs]);

  const handleSaveConfig = () => {
    if (!configForm.ruleName || !configForm.logPath) {
      alert('请填写规则名称与日志文件路径！');
      return;
    }
    const isEdit = editingConfigId != null;
    const url = isEdit ? `/api/v1/log-configs/${editingConfigId}` : '/api/v1/log-configs';
    const method = isEdit ? 'PUT' : 'POST';

    api(url, { method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(configForm) }).then(() => {
      setShowConfigModal(false);
      loadConfigs();
    });
  };

  const toggleConfig = (id) => {
    api(`/api/v1/log-configs/${id}/toggle`, { method: 'POST' }).then(() => loadConfigs());
  };

  const deleteConfig = (id) => {
    if (window.confirm('确认删除该日志采集规则？')) {
      api(`/api/v1/log-configs/${id}`, { method: 'DELETE' }).then(() => loadConfigs());
    }
  };

  const renderHighlightedContent = (text, kw) => {
    if (!kw || !text) return text;
    const parts = text.split(new RegExp(`(${kw.replace(/[.*+?^${}()|[\\]\\]/g, '\\$&')})`, 'gi'));
    return parts.map((part, i) =>
      part.toLowerCase() === kw.toLowerCase()
        ? React.createElement('mark', { key: i, style: { background: '#fef08a', color: '#000', padding: '0 2px', borderRadius: 2 } }, part)
        : part
    );
  };

  return React.createElement('div', {},
    // 顶部 Sub Tab
    React.createElement('div', { style: { display: 'flex', gap: 8, marginBottom: 16 } },
      React.createElement('button', {
        className: 'btn' + (subTab === 'explore' ? ' primary' : ''),
        onClick: () => setSubTab('explore')
      }, '🔍 日志探索大屏 (Explore)'),

function ChangePasswordModal({ visible, onClose }) {
  const [oldPassword, setOldPassword] = useState('');
  const [newPassword, setNewPassword] = useState('');
  const [confirmPassword, setConfirmPassword] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');

  if (!visible) return null;

  const handleSubmit = () => {
    setError('');
    if (!oldPassword || !newPassword) {
      setError('请输入当前密码和新密码');
      return;
    }
    if (newPassword.length < 5) {
      setError('新密码长度不能少于 5 位');
      return;
    }
    if (newPassword !== confirmPassword) {
      setError('两次输入的新密码不一致');
      return;
    }

    setLoading(true);
    api('/api/auth/change-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ oldPassword, newPassword })
    }).then(res => {
      setLoading(false);
      if (res.code === 200) {
        alert('密码修改成功，请使用新密码重新登录！');
        localStorage.removeItem('LP_TOKEN');
        document.cookie = 'LP_TOKEN=; path=/; max-age=0';
        window.location.replace(BASE + '/login.html');
      } else {
        setError(res.message || '修改失败');
      }
    }).catch(err => {
      setLoading(false);
      setError('修改异常: ' + err.message);
    });
  };

  return React.createElement('div', {className:'modal-overlay', onClick:e=>e.target===e.currentTarget&&onClose()},
    React.createElement('div', {className:'modal', style:{maxWidth:420}},
      React.createElement('h3', {}, '🔑 修改管理员密码'),
      error && React.createElement('div', {style:{background:'#fff2f0',border:'1px solid #ffccc7',color:'#ff4d4f',padding:'8px 12px',borderRadius:4,fontSize:13,marginBottom:12}}, error),
      React.createElement('div', {className:'form-row', style:{flexDirection:'column',alignItems:'flex-start',gap:4}},
        React.createElement('label', {}, '当前密码:'),
        React.createElement('input', {type:'password', value:oldPassword, onChange:e=>setOldPassword(e.target.value), placeholder:'请输入原密码', style:{width:'100%'}})),
      React.createElement('div', {className:'form-row', style:{flexDirection:'column',alignItems:'flex-start',gap:4}},
        React.createElement('label', {}, '新密码:'),
        React.createElement('input', {type:'password', value:newPassword, onChange:e=>setNewPassword(e.target.value), placeholder:'至少 5 位新密码', style:{width:'100%'}})),
      React.createElement('div', {className:'form-row', style:{flexDirection:'column',alignItems:'flex-start',gap:4}},
        React.createElement('label', {}, '确认新密码:'),
        React.createElement('input', {type:'password', value:confirmPassword, onChange:e=>setConfirmPassword(e.target.value), placeholder:'再次输入新密码', style:{width:'100%'}})),
      React.createElement('div', {className:'btn-row'},
        React.createElement('button', {className:'btn', onClick:onClose, disabled:loading}, '取消'),
        React.createElement('button', {className:'btn primary', onClick:handleSubmit, disabled:loading}, loading ? '保存中...' : '确认修改')

    )
  );
}

function App() {
  const isViewer = (localStorage.getItem('LP_ROLE') || 'ADMIN').toUpperCase() === 'VIEWER';
  const [tab, setTab] = useState('host-system');
  const [apps, setApps] = useState([]);
  const [currentApp, setCurrentApp] = useState(null);
  const [dashData, setDashData] = useState({});
  const [selectedEp, setSelectedEp] = useState(null);
  const [epTrend, setEpTrend] = useState([]);
  const [minutes, setMinutes] = useState(60);
  const [unackedAlerts, setUnackedAlerts] = useState(0);

  // 安装与底层存储向导状态
  const [setupStatus, setSetupStatus] = useState(null);
  const [showSetupModal, setShowSetupModal] = useState(false);
  const [showPwdModal, setShowPwdModal] = useState(false);
  const [showHelpModal, setShowHelpModal] = useState(false);

  const handleLogout = () => {
    if (window.confirm('确认退出当前登录？')) {
      api('/api/auth/logout', { method: 'POST' }).finally(() => {
        localStorage.removeItem('LP_TOKEN');
        localStorage.removeItem('LP_USER');
        localStorage.removeItem('LP_ROLE');
        document.cookie = 'LP_TOKEN=; path=/; max-age=0';
        window.location.replace(BASE + '/login.html');
      });
    }
  };

  const loadSetupStatus = useCallback(() => {
    api('/api/setup/status').then(res => {
      setSetupStatus(res);
      if (res && res.initialized === false && !localStorage.getItem('LP_SETUP_DISMISSED')) {
        setShowSetupModal(true);
      }
    }).catch(ignored => {});
  }, []);

  useEffect(() => {
    loadSetupStatus();
    api('/api/auth/status').then(r => {
      if (r && r.code === 200 && r.data) {
        if (r.data.role) localStorage.setItem('LP_ROLE', r.data.role);
        if (r.data.username) localStorage.setItem('LP_USER', r.data.username);
      }
    }).catch(ignored => {});
  }, [loadSetupStatus]);

  // 加载未确认告警数
  useEffect(() => {
    api('/api/v1/alerts?acknowledged=0&page=1&size=1').then(r => {
      setUnackedAlerts(r?.total||0);
    });
  }, [tab]);

  const TAB_MAP = {
    'host-system': '🖥️ 主机性能与容量',
    'probes': '⚡ 业务巡检与探活',
    'slow-sql': '🐢 慢 SQL 分析',
    'logs': '📜 日志中心 (Log Explorer)',
    'alerts': '🚨 告警中心' + (unackedAlerts > 0 ? ' (' + unackedAlerts + ')' : ''),
    'settings': '⚙️ 站点全局配置'
  };

  return React.createElement('div',{},
    React.createElement('div',{className:'header'},
      React.createElement('h1',{},'LightPulse 全景监控平台'),
      React.createElement('span',{className:'sub', style:{marginLeft:10,fontSize:13,opacity:0.75}},'轻量全栈主机资源监控与接口巡检中心'),
      React.createElement('div', {style:{marginLeft:'auto', display:'flex', alignItems:'center', gap:10}},
        React.createElement('button', {
          className:'btn small',
          style:{background:'#0284c7', color:'#ffffff', borderColor:'#0369a1', fontWeight:600, display:'flex', alignItems:'center', gap:4},
          onClick: () => setShowHelpModal(true)
        }, '💡 快速上手指南 & 方法论'),
        ((localStorage.getItem('LP_ROLE') || 'ADMIN') === 'VIEWER') && React.createElement('span', {
          style:{background:'linear-gradient(135deg, #f59e0b, #d97706)', color:'#fff', padding:'3px 10px', borderRadius:12, fontSize:12, fontWeight:700, display:'inline-flex', alignItems:'center', gap:4, boxShadow:'0 2px 4px rgba(217,119,6,0.3)'}
        }, '👁️ 只读模式 (viewer)'),
        React.createElement('span', {style:{fontSize:13, color:'#cbd5e1', display:'flex', alignItems:'center', gap:6, marginLeft:4}},
          '👤', React.createElement('strong', {style:{color:'#fff'}}, localStorage.getItem('LP_USER') || (((localStorage.getItem('LP_ROLE') || 'ADMIN') === 'VIEWER') ? 'viewer' : 'admin'))),
        ((localStorage.getItem('LP_ROLE') || 'ADMIN') !== 'VIEWER') && React.createElement('button', {
          className:'btn small',
          style:{background:'#2d3748', color:'#f8fafc', borderColor:'#4a5568'},
          onClick: () => setShowPwdModal(true)
        }, '🔑 修改密码'),
        React.createElement('button', {
          className:'btn small danger',
          onClick: handleLogout
        }, '退出登录'))
    ),
    React.createElement('div',{className:'container'},
      isViewer && React.createElement('div', {
        style: {
          background: 'linear-gradient(90deg, #fffbe6 0%, #fff1b8 100%)',
          border: '1px solid #ffe58f',
          borderRadius: 8,
          padding: '10px 16px',
          marginBottom: 16,
          display: 'flex',
          alignItems: 'center',
          gap: 10,
          color: '#d46b08',
          fontSize: 13,
          fontWeight: 500,
          boxShadow: '0 2px 4px rgba(250,173,20,0.1)'
        }
      },
        React.createElement('span', {style: {fontSize: 18}}, '👁️'),
        React.createElement('span', {}, '当前处于只读访客模式 (VIEWER)：系统全局运行参数、告警策略、探针与用户权限仅供浏览，所有新增、修改、重置与删除功能已被安全锁定保护。')
      ),
      React.createElement('div',{className:'tab-bar'},
        Object.entries(TAB_MAP).map(([k,v]) =>
          React.createElement('button',{
            key:k, className:'tab'+(tab===k?' active':''),
            onClick:()=>{setTab(k)}
          }, v))),
      tab === 'host-system' && React.createElement(HostSystemTab, { isViewer })
      || tab === 'probes' && React.createElement(ProbesTab, { isViewer })
      || tab === 'slow-sql' && React.createElement(SlowSqlTab)
      || tab === 'logs' && React.createElement(LogsTab, { isViewer })
      || tab === 'alerts' && React.createElement(AlertsTab, { isViewer })
      || tab === 'settings' && React.createElement(SettingsTab, {
        setupStatus,
        onOpenWizard: () => setShowSetupModal(true),
        isViewer
      })
    ),
    React.createElement(SetupWizardModal, {
      visible: showSetupModal,
      currentStatus: setupStatus,
      isViewer,
      onSaved: () => {
        localStorage.setItem('LP_SETUP_DISMISSED', 'true');
        setShowSetupModal(false);
        loadSetupStatus();
      },
      onClose: () => {
        localStorage.setItem('LP_SETUP_DISMISSED', 'true');
        setShowSetupModal(false);
      }
    }),
    React.createElement(ChangePasswordModal, {
      visible: showPwdModal,
      onClose: () => setShowPwdModal(false)
    }),
    React.createElement(HelpGuideModal, {
      visible: showHelpModal,
      onClose: () => setShowHelpModal(false)
    })
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
